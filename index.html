<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0E1220">
<title>Family leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#0E1220; --card:#171C2E; --card2:#1F2539; --line:#2A3150;
  --text:#EEF1FA; --muted:#98A1BF; --faint:#5F6889;
  --green:#3DDC84; --amber:#F5B83D; --red:#F2605C; --strain:#4DA3FF; --sleepc:#9B8CFF; --dawn:#FF9D7A;
  --deepc:#5767F2; --remc:#A07CF5; --lightc:#3A4370;
  --font:'Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif;
  --disp:'Bricolage Grotesque','Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#EEF0F7; --card:#FFFFFF; --card2:#F3F4FA; --line:#DCDFEC;
    --text:#141828; --muted:#5A6283; --faint:#9AA1BD;
    --green:#139257; --amber:#B47805; --red:#CC3A36; --strain:#1F6FD1; --sleepc:#6A57E0; --dawn:#C85F3D;
    --deepc:#3F50D6; --remc:#7A55DC; --lightc:#C7CCE5;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--dawn);outline-offset:2px;border-radius:8px}
#app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h2{font-family:var(--disp);font-weight:700;font-size:1.3rem;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.sec{margin-top:26px}
.note{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.card{background:var(--card);border-radius:20px;padding:16px}
.tap{display:block;width:100%}
.tap:active{transform:scale(.99)}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.top .day{font-family:var(--disp);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.top .sub{color:var(--muted);font-size:.82rem}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--card);font-size:.74rem;color:var(--muted);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
.pill.stale .dot{background:var(--amber)}

/* winners strip */
.wins{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.wins::-webkit-scrollbar{display:none}
.win{flex:0 0 auto;background:var(--card);border-radius:14px;padding:8px 12px;font-size:.85rem;line-height:1.25}
.win b{font-weight:700}
.win .s{color:var(--muted);font-size:.78rem}
.crown{color:var(--amber);margin-right:4px}

/* who strip */
.who{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px 2px}
.who::-webkit-scrollbar{display:none}
.who button{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--card);color:var(--muted);font-weight:700;font-size:.9rem}
.who button[aria-pressed="true"]{background:var(--text);color:var(--bg)}

/* dials */
.dials{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dial{background:var(--card);border-radius:20px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center}
.dial .lab{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.dial .more{font-size:.75rem;color:var(--faint)}
.ring .trk{stroke:var(--card2)}
.ring .arc{transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.why{margin:12px 2px 0;font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{padding:5px 10px;border-radius:999px;background:var(--card);font-size:.8rem;font-weight:700}
.chip.hot{background:color-mix(in srgb,var(--dawn) 22%,var(--card))}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border-radius:16px;padding:12px}
.tile .k{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--disp);font-weight:700;font-size:1.3rem;margin-top:2px}
.tile .v small{font-family:var(--font);font-weight:400;font-size:.75rem;color:var(--muted);margin-left:2px}
.tile .d{font-size:.76rem;color:var(--muted)}
.up{color:var(--green)} .down{color:var(--red)}

/* next matchup */
.vsbox{display:flex;justify-content:space-between;align-items:center;gap:10px}
.vsbox .big{font-family:var(--disp);font-weight:800;font-size:1.2rem}

/* rows / bars */
.row{display:block;width:100%;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rt{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rt .n{font-weight:700}
.rt .v{font-family:var(--disp);font-weight:700}
.row.me .n{color:var(--dawn)}
.bar{display:flex;height:9px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.meta{color:var(--muted);font-size:.8rem;margin-top:3px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;gap:2px;margin-bottom:10px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:.84rem;font-weight:700;color:var(--muted);text-align:center}
.seg button[aria-pressed="true"]{background:var(--card2);color:var(--text)}
.rank{display:inline-block;width:22px;color:var(--faint);font-weight:700}

/* matchup rows */
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;width:100%;padding:12px 0;border-bottom:1px solid var(--line)}
.mu:last-child{border-bottom:0}
.side{display:flex;align-items:baseline;gap:8px}
.side.r{justify-content:flex-end}
.side .sc{font-family:var(--disp);font-weight:800;font-size:1.3rem}
.side.lose{color:var(--muted)} .side.lose .sc{color:var(--faint)}
.side.win .sc{color:var(--green)}
.mid{color:var(--faint);font-size:.76rem;text-align:center;min-width:48px}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t td{padding:8px 0;border-bottom:1px solid var(--line)}
table.t td.r{text-align:right;color:var(--muted)}
table.t td.b{text-align:right;font-weight:700;width:56px}
table.t tr.me td:first-child{color:var(--dawn);font-weight:700}

/* feed */
.feed{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end}
.av{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:#fff}
.bub{background:var(--card2);border-radius:18px 18px 18px 6px;padding:9px 13px;max-width:82%}
.bub .who2{font-size:.75rem;color:var(--muted);font-weight:700}
.bub .tx{font-size:.95rem}
.bub .when{font-size:.72rem;color:var(--faint)}
.trash{display:block;width:100%;margin-top:12px;padding:12px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:700;text-align:center;text-decoration:none}

/* week */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{background:var(--card);border-radius:16px;padding:12px}
.cat h4{margin:0 0 6px;font-size:.84rem;color:var(--muted)}
.cat.pen h4{color:var(--red)}
.cat ol{margin:0;padding:0;list-style:none;font-size:.88rem}
.cat li{display:flex;justify-content:space-between;gap:6px}
.cat li:first-child{font-weight:700}
.cat li span:last-child{color:var(--muted);font-weight:400;text-align:right}

/* detail sheet */
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 40px);animation:rise .25s ease-out}
.sheet .in{max-width:600px;margin:0 auto}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.back{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--card);font-weight:700;font-size:.9rem}
.hd{text-align:center;margin:14px 0 8px}
.hd .k{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hd .big{font-family:var(--disp);font-weight:800;font-size:3.4rem;line-height:1;margin-top:4px}
.hd .s{color:var(--muted);font-size:.9rem;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.stat .v{font-family:var(--disp);font-weight:700;font-size:1.05rem}
.stat .k{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chart{width:100%;display:block}
.chart text{fill:var(--faint);font-size:10px;font-family:var(--font)}
.contrib{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.contrib:last-child{border-bottom:0}
.contrib .n{font-weight:700}
.contrib .v{text-align:right;font-family:var(--disp);font-weight:700}
.contrib .m{grid-column:1/-1;color:var(--muted);font-size:.82rem}
.dev{grid-column:1/-1;position:relative;height:8px;background:var(--card2);border-radius:5px;margin-top:4px}
.dev i{position:absolute;top:0;bottom:0;border-radius:5px}
.dev b{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--faint)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;font-weight:700;color:var(--faint)}
nav.tabs button[aria-pressed="true"]{color:var(--text)}
nav.tabs svg{width:22px;height:22px}

/* picker */
.pick h1{font-family:var(--disp);font-weight:800;font-size:2rem;margin:20px 0 6px}
.pick .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick .grid button{padding:18px;border-radius:18px;background:var(--card);font-family:var(--disp);font-weight:700;font-size:1.15rem}
footer{margin-top:28px;color:var(--faint);font-size:.8rem}
@media (prefers-reduced-motion: reduce){.ring .arc{transition:none}.sheet{animation:none}}
body{font-size:17px}
.info{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--card2);color:var(--muted);font-weight:700;font-size:.8rem;flex:0 0 24px}
.lead{font-size:1.05rem;text-align:center;margin:4px 6px 4px;color:var(--text)}
.ex{margin:0 0 8px;font-size:.95rem}
.ex:last-child{margin-bottom:0}
.scorebar{margin-top:10px;display:block;width:100%}
.scorebar .k{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scorebar .big{font-family:var(--disp);font-weight:800;font-size:2.2rem;line-height:1.1}
.stack{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:6px;gap:2px}
.stack i{display:block;height:100%}
.tapmore{display:inline-block;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--strain)}
.tiles.two{grid-template-columns:repeat(2,1fr)}
.sub2{font-size:.76rem;color:var(--faint);margin-top:3px;line-height:1.3}
.batt{position:relative;height:8px;border-radius:5px;background:var(--card2);overflow:hidden;margin-top:6px}
.batt i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.batt b{position:absolute;top:0;bottom:0;border:2px solid var(--text);border-radius:5px;opacity:.55}
.live{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px}
.live .big{font-family:var(--disp);font-weight:800;font-size:1.25rem}
.live .vs{color:var(--faint);font-weight:700}
.memgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.mem{background:var(--card);border-radius:18px;padding:12px;display:block;width:100%}
.mem.me{outline:2px solid color-mix(in srgb,var(--dawn) 60%,transparent)}
.mem .n{font-weight:700}
.minis{display:flex;justify-content:space-between;margin-top:8px}
.minil{display:flex;justify-content:space-between;font-size:.68rem;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;padding:0 4px}
.mx{display:grid;gap:3px;font-size:.78rem;overflow-x:auto}
.mx .h{color:var(--muted);font-weight:700;text-align:center;padding:4px 0}
.mx .h.r{text-align:left}
.mx .c{background:var(--card2);border-radius:6px;text-align:center;padding:6px 0;font-variant-numeric:tabular-nums}
.mx .c.w{background:color-mix(in srgb,var(--green) 28%,var(--card2))}
.mx .c.l{background:color-mix(in srgb,var(--red) 22%,var(--card2))}
.mx .c.x{background:transparent}
.big2{font-family:var(--disp);font-weight:800;font-size:1.8rem}
.rt h2,.rt h3{margin:0}

.rt{margin-bottom:8px}
.card .rt h3{margin:0}
</style></head>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const H = D.history || {};
const KEY = 'sleepboard_me';
let me = null; try { me = localStorage.getItem(KEY); } catch(e) {}
const names = Array.from(new Set([].concat(Object.keys(H), (D.detail||[]).map(x=>x.name), (D.sleep||[]).map(x=>x.name)))).sort();
if (me && !names.includes(me)) me = null;
let view = me, tab = 'home', sheet = null, range = 14, board = 'rec';

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const band = v => v==null ? 'var(--faint)' : v>=67 ? 'var(--green)' : v>=34 ? 'var(--amber)' : 'var(--red)';
const hm = m => m==null ? '\u2013' : Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';
const ord = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const dow = s => ['Su','M','Tu','W','Th','F','Sa'][new Date(s+'T12:00:00Z').getUTCDay()];
const longDay = s => new Date(s+'T12:00:00Z').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'});
const DAY = D.day_iso || (()=>{ let b=null; for (const n in H) for (const k in H[n].days) if(!b||k>b) b=k; return b; })();
const TODAY = DAY ? addDays(DAY,1) : null;
const rec = (n,k) => (H[n] && H[n].days[k]) || {};
const base = n => (H[n]||{}).base || {};
const detailOf = n => (D.detail||[]).find(x=>x.name===n);
const avg = a => { const b=a.filter(v=>v!=null); return b.length ? b.reduce((x,y)=>x+y,0)/b.length : null; };
const days = n => { const k=[]; for (let i=n-1;i>=0;i--) k.push(addDays(DAY,-i)); return k; };
const COLORS = ['#E8735A','#4DA3FF','#3DDC84','#B07CF5','#F5B83D','#2EC4B6','#F2605C','#8A9BFF'];
const colorOf = n => COLORS[names.indexOf(n) % COLORS.length];

/* Cardio load: minutes in heart-rate zones, harder zones count more. Straight line, no curve:
   every extra minute counts the same. Rings fill at twice your own normal. */
const strainOf = r => r.load==null ? null : r.load;
const loadMax = n => { const b=(((H[n]||{}).base)||{}).load; return Math.max(60, 2*(b||60)); };
const restor = r => (r.deep==null && r.rem==null) ? null : (r.deep||0)+(r.rem||0);

const M = {
  rec:    {label:'Recovery', get:r=>r.rec, fmt:v=>Math.round(v)+'%', max:100, col:band, hi:true},
  sleep:  {label:'Sleep', get:r=>r.sleep, fmt:v=>Math.round(v)+'%', max:100, col:band, hi:true},
  strain: {label:'Cardio load', get:strainOf, fmt:v=>String(Math.round(v)), col:()=> 'var(--strain)', hi:true},
  daily:  {label:'Daily score', get:r=>r.daily, fmt:v=>Math.round(v), max:100, col:band, hi:true},
  hrv:    {label:'HRV', get:r=>r.hrv, fmt:v=>Math.round(v)+' ms', col:()=> 'var(--green)', hi:true, base:'hrv'},
  rhr:    {label:'Resting HR', get:r=>r.rhr, fmt:v=>Math.round(v)+' bpm', col:()=> 'var(--red)', hi:false, base:'rhr'},
  rr:     {label:'Resp. rate', get:r=>r.rr, fmt:v=>v.toFixed(1)+' rpm', col:()=> 'var(--sleepc)', hi:null, base:'rr'},
  asleep: {label:'Hours asleep', get:r=>r.asleep, fmt:hm, col:()=> 'var(--sleepc)', hi:true, base:'dur'},
  restor: {label:'Deep + REM', get:restor, fmt:hm, col:()=> 'var(--remc)', hi:true},
  steps:  {label:'Steps', get:r=>r.steps, fmt:v=>Math.round(v).toLocaleString(), col:()=> 'var(--amber)', hi:true},
  load:   {label:'Cardio load', get:r=>r.load, fmt:v=>Math.round(v), col:()=> 'var(--strain)', hi:true},
};
const val = (m,n,k) => { const v=M[m].get(rec(n,k)); return v==null||isNaN(v)?null:v; };

function famRank(m, k){
  const hi = M[m].hi!==false;
  return names.map(n=>[n,val(m,n,k)]).filter(x=>x[1]!=null).sort((a,b)=>hi?b[1]-a[1]:a[1]-b[1]);
}

/* ---------- matchups ---------- */
function pairings(dayIso){
  const list = names.slice();
  if (list.length < 2) return {pairs:[], bye:null};
  if (list.length % 2) list.push(null);
  const m = list.length, rounds = m - 1;
  const idx = Math.round((Date.parse(dayIso+'T12:00:00Z') - Date.parse('2026-01-01T12:00:00Z'))/864e5);
  const r = ((idx % rounds) + rounds) % rounds;
  const rest = list.slice(1);
  const arr = [list[0]].concat(rest.slice(r).concat(rest.slice(0,r)));
  const pairs=[]; let bye=null;
  for (let i=0;i<m/2;i++){ const a=arr[i], b=arr[m-1-i];
    if (a===null) bye=b; else if (b===null) bye=a; else pairs.push([a,b]); }
  return {pairs, bye};
}
function result(a,b,k){
  const sa=rec(a,k).daily, sb=rec(b,k).daily;
  if (sa==null && sb==null) return null;
  if (sb==null) return {w:a,l:b,sa,sb};
  if (sa==null) return {w:b,l:a,sa,sb};
  if (sa===sb) return {tie:true,sa,sb};
  return sa>sb ? {w:a,l:b,sa,sb} : {w:b,l:a,sa,sb};
}
function record(){
  const t={}; names.forEach(n=>t[n]={w:0,l:0,t:0,streak:0});
  if (!DAY) return t;
  for (let i=29;i>=0;i--){ const k=addDays(DAY,-i);
    pairings(k).pairs.forEach(([a,b])=>{ const r=result(a,b,k); if(!r) return;
      if (r.tie){ t[a].t++; t[b].t++; t[a].streak=0; t[b].streak=0; }
      else { t[r.w].w++; t[r.l].l++; t[r.w].streak=Math.max(1,t[r.w].streak+1); t[r.l].streak=0; } });
  }
  return t;
}
function streak(n, test){ let s=0; if(!DAY) return 0;
  for (let i=0;i<60;i++){ if(test(rec(n,addDays(DAY,-i)))) s++; else break; } return s; }

/* ---------- drawing ---------- */
function ring(v, max, size, sw, col, label){
  const r=(size-sw)/2, c=2*Math.PI*r, pct=v==null?0:Math.max(0,Math.min(max,v))/max;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+esc(label)+'">'+
    '<circle class="trk" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="'+sw+'"/>'+
    '<circle class="arc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+c.toFixed(1)+'" data-off="'+(c*(1-pct)).toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-family:var(--disp);font-weight:800;font-size:'+(size*0.27)+'px">'+label+'</text></svg>';
}
/* bar chart: vals[], keys[], colour fn, max, optional average line */
function bars(vals, keys, colFn, max, avgV, h){
  h=h||150; const W=340, pad=18, n=vals.length, bw=(W-8)/n;
  const mx = max || Math.max.apply(null, vals.filter(v=>v!=null).concat([1]))*1.12;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+(h+pad)+'" preserveAspectRatio="none">';
  vals.forEach((v,i)=>{ const x=4+i*bw+bw*0.18, w=bw*0.64;
    if (v==null){ s+='<rect x="'+x.toFixed(1)+'" y="'+(h-3)+'" width="'+w.toFixed(1)+'" height="3" rx="1.5" fill="var(--card2)"/>'; }
    else { const bh=Math.max(3,h*v/mx); s+='<rect x="'+x.toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="'+Math.min(5,w/2).toFixed(1)+'" fill="'+colFn(v)+'"/>'; }
    if (n<=14 || i%3===n%3-1 || i===n-1) s+='<text x="'+(4+i*bw+bw/2).toFixed(1)+'" y="'+(h+13)+'" text-anchor="middle">'+(n<=14?dow(keys[i]):keys[i].slice(5).replace('-','/'))+'</text>';
  });
  if (avgV!=null){ const y=h-h*avgV/mx; s+='<line x1="0" x2="'+W+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>'; }
  return s+'</svg>';
}
/* multi-line chart for comparing people */
function lines(series, keys, h){
  h=h||150; const W=340, pad=18, n=keys.length;
  const all=[].concat.apply([], series.map(s=>s.vals)).filter(v=>v!=null);
  if (!all.length) return '<p class="note">No readings yet.</p>';
  let lo=Math.min.apply(null,all), hi=Math.max.apply(null,all); if (hi===lo){hi+=1;lo-=1;}
  const sp=(hi-lo)*0.12; lo-=sp; hi+=sp;
  const X=i=>4+(W-8)*i/(n-1||1), Y=v=>h-h*(v-lo)/(hi-lo);
  let s='<svg class="chart" viewBox="0 0 '+W+' '+(h+pad)+'" preserveAspectRatio="none">';
  series.forEach(se=>{ let d=''; let pen=false;
    se.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); pen=true; });
    s+='<path d="'+d+'" fill="none" stroke="'+se.col+'" stroke-width="'+(se.bold?3:1.6)+'" stroke-linejoin="round" stroke-linecap="round" opacity="'+(se.bold?1:.7)+'"/>';
    const li=se.vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();
    if (li!=null && li>=0) s+='<circle cx="'+X(li).toFixed(1)+'" cy="'+Y(se.vals[li]).toFixed(1)+'" r="'+(se.bold?4:2.5)+'" fill="'+se.col+'"/>';
  });
  [0, Math.floor((n-1)/2), n-1].forEach(i=>{ s+='<text x="'+X(i).toFixed(1)+'" y="'+(h+13)+'" text-anchor="'+(i===0?'start':i===n-1?'end':'middle')+'">'+keys[i].slice(5).replace('-','/')+'</text>'; });
  return s+'</svg>';
}
function stageBars(n, keys){
  const W=340,h=150,pad=18,bw=(W-8)/keys.length;
  const vals=keys.map(k=>rec(n,k)); const mx=Math.max.apply(null, vals.map(r=>r.asleep||0).concat([480]))*1.08;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+(h+pad)+'" preserveAspectRatio="none">';
  vals.forEach((r,i)=>{ const x=4+i*bw+bw*0.18, w=bw*0.64; let y=h;
    if (r.asleep==null){ s+='<rect x="'+x.toFixed(1)+'" y="'+(h-3)+'" width="'+w.toFixed(1)+'" height="3" fill="var(--card2)"/>'; }
    else { const parts=[[r.deep||0,'var(--deepc)'],[r.rem||0,'var(--remc)'],[Math.max(0,r.asleep-(r.deep||0)-(r.rem||0)),'var(--lightc)']];
      parts.forEach(p=>{ const bh=h*p[0]/mx; y-=bh; s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="'+p[1]+'"/>'; }); }
    s+='<text x="'+(4+i*bw+bw/2).toFixed(1)+'" y="'+(h+13)+'" text-anchor="middle">'+dow(keys[i])+'</text>';
  });
  const need=base(n).dur; if (need){ const yy=h-h*need/mx; s+='<line x1="0" x2="'+W+'" y1="'+yy.toFixed(1)+'" y2="'+yy.toFixed(1)+'" stroke="var(--muted)" stroke-dasharray="4 4"/>'; }
  return s+'</svg>';
}
function devRow(label, v, b, fmt, goodHigh, note){
  if (v==null) return '<div class="contrib"><span class="n">'+label+'</span><span class="v">\u2013</span><span class="m">No reading</span></div>';
  let html='<div class="contrib"><span class="n">'+label+'</span><span class="v">'+fmt(v)+'</span>';
  if (b){ const p=(v-b)/b; const good = goodHigh==null ? Math.abs(p)<0.05 : (goodHigh ? p>=0 : p<=0);
    const w=Math.min(50, Math.abs(p)*250); const col= good?'var(--green)':'var(--red)';
    html+='<span class="m">'+(note||('Normal '+fmt(b)+', '+(p>=0?'+':'')+Math.round(p*100)+'%'))+'</span>'+
      '<span class="dev"><b></b><i style="'+(p>=0?'left:50%':'right:50%')+';width:'+w.toFixed(1)+'%;background:'+col+'"></i></span>';
  } else if (note) html+='<span class="m">'+note+'</span>';
  return html+'</div>';
}
function famBars(m, k){
  const r=famRank(m,k); if(!r.length) return '<p class="note">No readings.</p>';
  const mx=M[m].max || Math.max.apply(null, r.map(x=>x[1]))*1.05;
  return r.map((x,i)=>'<button class="row tap'+(x[0]===view?' me':'')+'" data-view="'+esc(x[0])+'"><div class="rt"><span class="n"><span class="rank">'+(i+1)+'</span>'+esc(x[0])+'</span><span class="v">'+M[m].fmt(x[1])+'</span></div>'+
    '<div class="bar"><i style="width:'+(100*x[1]/mx).toFixed(1)+'%;background:'+M[m].col(x[1])+'"></i></div></button>').join('');
}

/* ---------- header pieces ---------- */
function header(){
  let ago='', stale=false;
  if (D.updated_iso){ const mins=Math.round((Date.now()-Date.parse(D.updated_iso))/6e4); stale=mins>180;
    ago = mins<2?'just now': mins<60? mins+' min ago' : mins<1440? Math.round(mins/60)+'h ago' : Math.round(mins/1440)+'d ago'; }
  return '<div class="top"><div><div class="day">'+(DAY?longDay(DAY):'')+'</div><div class="sub">Last full day of scores</div></div>'+
    '<span class="pill'+(stale?' stale':'')+'"><span class="dot"></span>Updated '+esc(D.stamp||'')+(ago?', '+ago:'')+'</span></div>';
}
function winStrip(){
  if (!DAY) return '';
  const y=pairings(DAY); const items=[];
  const top=famRank('daily',DAY)[0];
  if (top) items.push('<button class="win tap" data-tab="h2h"><span class="crown">\u265B</span><b>'+esc(top[0])+'</b> won the day<div class="s">daily score '+Math.round(top[1])+'</div></button>');
  y.pairs.forEach(([a,b])=>{ const r=result(a,b,DAY); if(!r||r.tie) return;
    items.push('<button class="win tap" data-tab="h2h"><span class="crown">\u2714</span><b>'+esc(r.w)+'</b> beat '+esc(r.l)+'<div class="s">'+(r.sa!=null&&r.sb!=null?Math.round(Math.max(r.sa,r.sb))+' to '+Math.round(Math.min(r.sa,r.sb)):'no-show')+'</div></button>'); });
  return items.length?'<div class="wins">'+items.join('')+'</div>':'';
}
function whoStrip(){
  const o = me ? [me].concat(names.filter(n=>n!==me)) : names;
  return '<div class="who">'+o.map(n=>'<button data-view="'+esc(n)+'" aria-pressed="'+(n===view)+'">'+esc(n)+(n===me?' (you)':'')+'</button>').join('')+'</div>';
}
function whyLine(n){
  const r=rec(n,DAY), b=base(n), bits=[];
  if (r.asleep!=null && b.dur){ const d=Math.round(r.asleep-b.dur);
    bits.push({w:Math.abs(d)/b.dur, t: Math.abs(d)>=10 ? 'Slept <b>'+Math.abs(d)+' min '+(d>0?'more':'less')+'</b> than usual' : 'Slept your usual <b>'+hm(r.asleep)+'</b>'}); }
  if (r.hrv!=null && b.hrv){ const p=Math.round(100*(r.hrv-b.hrv)/b.hrv); if (Math.abs(p)>=5) bits.push({w:Math.abs(p)/100, t:'HRV <b>'+Math.abs(p)+'% '+(p>0?'above':'below')+'</b> normal'}); }
  if (r.rhr!=null && b.rhr){ const d=Math.round(r.rhr-b.rhr); if (Math.abs(d)>=2) bits.push({w:Math.abs(d)/b.rhr, t:'resting HR <b>'+Math.abs(d)+' bpm '+(d<0?'lower':'higher')+'</b>'}); }
  if (!bits.length) return r.daily==null?'No reading for last night yet.':'';
  bits.sort((a,b)=>b.w-a.w); const s=bits.slice(0,2).map(x=>x.t);
  s[0]=s[0].charAt(0).toUpperCase()+s[0].slice(1); if(s[1] && !/^HRV/.test(s[1])) s[1]=s[1].charAt(0).toLowerCase()+s[1].slice(1);
  return s.join(', and ')+'.';
}

/* ---------- today ---------- */
const todayRow = n => (D.today||[]).find(x=>x.name===n) || {};
const strainToday = n => { const t=todayRow(n); return t.load==null ? null : t.load; };
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const idlePts = r => r.idle==null ? null : clamp(100*(80-r.idle)/40, 0, 100);
/* Steps vs your own recent normal, 70 = normal; 8,000+ never below 70. Mirrors sleep_report.steps_score(). */
function stepsPts(r, b){ if (r.steps==null) return null; let s;
  if (b){ let d=(r.steps-b)/b/0.6; d=Math.max(-1,Math.min(1,d)); s = d>=0 ? 70+30*d : 70+70*d; } else s=clamp(70*r.steps/8000,0,100);
  if (r.steps>=8000) s=Math.max(s,70); return Math.round(clamp(s,0,100)); }
function dailyParts(n,k){
  const r=rec(n,k);
  const p=[['Sleep score',r.sleep,25,'sleep'],['Recovery',r.rec,25,'rec'],['Effort vs your normal',r.effort,20,'effort'],['Steps vs your normal',stepsPts(r,base(n).steps),15,'steps'],['Time not sitting',idlePts(r),15,'idle']].filter(x=>x[1]!=null);
  const tw=p.reduce((s,x)=>s+x[2],0);
  return {parts:p.map(x=>({k:x[0],v:x[1],w:x[2],share:tw?x[2]/tw:0,pts:tw?x[1]*x[2]/tw:0,key:x[3]})), total:tw?Math.round(p.reduce((s,x)=>s+x[1]*x[2],0)/tw):null};
}
function sleepNeed(n){
  const b=base(n).dur; if(!b) return null;
  const debt=days(7).reduce((s,k)=>{const a=val('asleep',n,k); return s+(a==null?0:Math.max(0,b-a));},0);
  const st=strainToday(n)||0, nb=(((H[n]||{}).base)||{}).load||null, hard=nb?st>=1.5*nb:false;
  return {need:Math.round(b+debt/4+(hard?15:0)), base:b, debt:Math.round(debt), extra:hard?15:0};
}
const info = (key, label) => '<button class="info" data-info="'+key+'" aria-label="How '+esc(label||key)+' works">?</button>';

/* ---------- explainers: every number, in plain words ---------- */

          sec('How to raise it', P('Sleep your usual hours at your usual time, move a little more than your normal, and break up long sits.'))}; },
    sleep:()=>({title:'Sleep score', big:r.sleep!=null?Math.round(r.sleep)+'%':'\u2013', lead:'How good last night was compared with your own normal. 70 means a normal night for you.',
      body:(det.sleep_parts&&det.sleep_parts.length&&n===view?sec('Your last night', det.sleep_parts.map(x=>row(esc(x[0]),'',esc(x[1]))).join('')):'')+

        sec('How to raise it', P('Same bedtime every night matters as much as total hours. Cut screens and caffeine late in the day.'))}),
    rec:()=>({title:'Recovery', big:r.rec!=null?Math.round(r.rec)+'%':'\u2013', lead:'How ready your body is today, from your overnight heart. Green 67 and up, yellow 34 to 66, red below 34.',
      body:(det.rec_parts&&det.rec_parts.length&&n===view?sec('Your inputs', det.rec_parts.map(x=>row(esc(x[0]),'',esc(x[1]))).join('')):'')+
        sec('How it works', P('HRV counts 40%, resting heart rate 30%, breathing rate 30%.')+P('Each one is compared with your own last 30 days, never with anyone else. Exactly normal for you scores 70.')+P('Higher HRV, lower resting heart rate and steady breathing all push it up.'))+
        sec('How to raise it', P('Sleep, hydration and an easy day after a hard one. Alcohol, late meals, stress and getting sick pull it down, often for a day or two.'))}),
    strain:()=>{ const v=val('strain',n,DAY), nb=(((H[n]||{}).base)||{}).load;
      return {title:'Cardio load', big:v!=null?Math.round(v):'\u2013', lead:'How much work your heart did. Every minute in a heart-rate zone adds to it, and harder minutes add more. It only goes up.',
      body: sec('Your day', row('Cardio load', v!=null?'<b>'+Math.round(v)+'</b>':'\u2013','Moderate minutes count 1x, vigorous 2x, peak 3x')+row('Your normal', nb?Math.round(nb):'\u2013','Typical day over the last 2 weeks')+row('Steps', r.steps!=null?Math.round(r.steps).toLocaleString():'\u2013','Counted separately in the Daily score'))+
        sec('Good to know', P('Cardio load is a straight count: twice the work is twice the number, with no curve.')+P('Your Effort score in the Daily score compares this number with your own normal, so a light day for an athlete and a big day for anyone else are judged fairly.'))}; },
    sleepneed:()=>{ const s=sleepNeed(n);

    rhr:()=>({title:'Resting heart rate', big:r.rhr!=null?Math.round(r.rhr)+' bpm':'\u2013', lead:'Your heart rate at full rest overnight. Lower than your normal usually means you are recovered.',

    restor:()=>({title:'Deep + REM', big:hm(restor(r)), lead:'The two stages that do the most repair. Deep sleep restores the body, REM restores the mind.', body: sec('Good to know', P('Most adults get about 40% of the night in these two stages. Alcohol and late caffeine cut both.'))}),
    steps:()=>({title:'Steps', big:r.steps!=null?Math.round(r.steps).toLocaleString():'\u2013', lead:'Total steps for the day.', body: sec('Good to know', P('Steps feed the Daily score, the weekly Steps category, and help the sitting part of your Daily score.'))}),

    h2h:()=>({title:'1v1', big:'', lead:'Everyone gets a new opponent every day, rotating so you face everyone.', body: sec('How it works', P('Higher Daily score wins the day. If one of you has no reading, the other wins by no-show.')+P('Your record covers the last 30 days. Tonight\u2019s sleep and today\u2019s activity decide today\u2019s matchup.'))}),

}

/* ---------- Me ---------- */
function me_tab(){
  const n=view, r=rec(n,DAY), b=base(n), det=detailOf(n);
  const st=strainOf(r), dp=dailyParts(n,DAY);
  const tile=(m,k,sub,v,fmt,unit,cmp,goodHigh)=>{
    let d=''; if (v!=null && cmp!=null){ const diff=v-cmp; const good=goodHigh==null?null:(goodHigh?diff>=0:diff<=0);
      d='<div class="d '+(good==null?'':good?'up':'down')+'">'+(diff>=0?'\u25B2 ':'\u25BC ')+fmt(Math.abs(diff))+' vs normal</div>'; }
    return '<button class="tile tap" data-sheet="'+m+'"><div class="k">'+k+'</div><div class="v">'+(v==null?'\u2013':fmt(v))+(unit&&v!=null?'<small>'+unit+'</small>':'')+'</div>'+d+'<div class="sub2">'+sub+'</div></button>'; };
  const wear=streak(n,x=>x.asleep!=null), green=streak(n,x=>x.rec!=null&&x.rec>=67);
  const recs=Object.values((H[n]||{}).days||{}).map(x=>x.rec).filter(v=>v!=null);
  const chips=[];
  if (wear>=2) chips.push('<span class="chip">'+wear+' nights worn in a row</span>');
  if (green>=2) chips.push('<span class="chip hot">'+green+' green days in a row</span>');
  if (r.rec!=null && recs.length>=7 && r.rec>=Math.max.apply(null,recs)) chips.push('<span class="chip hot">Best recovery in 30 days</span>');
  const sT=strainToday(n), sn=sleepNeed(n);
  const t=pairings(TODAY), p=t.pairs.find(x=>x.includes(n)), rc=record();
  let nx='';
  if (p){ const o=p[0]===n?p[1]:p[0]; const a=strainToday(n), c=strainToday(o), sa=todayRow(n).steps, sc=todayRow(o).steps;
    nx='<button class="card tap sec" data-tab="h2h"><div class="rt"><h3 style="margin:0">Today\u2019s 1v1</h3><span class="note" style="margin:0">'+rc[n].w+'\u2013'+rc[n].l+' vs '+(rc[o]||{w:0}).w+'\u2013'+(rc[o]||{l:0}).l+'</span></div>'+
      '<div class="live"><div><div class="big">'+esc(n)+'</div><div class="note" style="margin:0">'+(a!=null?'Load '+Math.round(a):'no activity yet')+(sa!=null?', '+Math.round(sa).toLocaleString()+' steps':'')+'</div></div><div class="vs">vs</div><div style="text-align:right"><div class="big">'+esc(o)+'</div><div class="note" style="margin:0">'+(c!=null?'Load '+Math.round(c):'no activity yet')+(sc!=null?', '+Math.round(sc).toLocaleString()+' steps':'')+'</div></div></div>'+
      '<div class="meta">Live so far. Tonight\u2019s sleep decides it.</div></button>'; }
  const dScore = r.daily!=null ? Math.round(r.daily) : null;
  return whoStrip()+
    '<div class="dials">'+
      '<button class="dial tap" data-sheet="sleep">'+ring(r.sleep,100,92,9,band(r.sleep),r.sleep==null?'\u2013':Math.round(r.sleep)+'%')+'<span class="lab">Sleep</span><span class="more">'+hm(r.asleep)+'</span></button>'+
      '<button class="dial tap" data-sheet="rec">'+ring(r.rec,100,92,9,band(r.rec),r.rec==null?'\u2013':Math.round(r.rec)+'%')+'<span class="lab">Recovery</span><span class="more">'+(r.rec==null?'\u00a0':r.rec>=67?'Green':r.rec>=34?'Yellow':'Red')+'</span></button>'+
      '<button class="dial tap" data-sheet="strain">'+ring(st,loadMax(n),92,9,'var(--strain)',st==null?'\u2013':Math.round(st))+'<span class="lab">Cardio load</span><span class="more">'+((((H[n]||{}).base)||{}).load?'normal '+Math.round(H[n].base.load):'\u00a0')+'</span></button>'+
    '</div>'+
    '<button class="card tap scorebar" data-info="daily"><div><div class="k">Daily score '+(det&&det.daily!=null?'<span class="dim">'+ord(det.rank)+' of '+det.of+'</span>':'')+'</div><div class="big">'+(dScore!=null?dScore:'\u2013')+'</div></div>'+
      '<div class="stack">'+dp.parts.map(x=>'<i title="'+esc(x.k)+'" style="flex:'+x.pts.toFixed(2)+';background:'+({sleep:'var(--sleepc)',rec:'var(--green)',effort:'var(--strain)',steps:'var(--dawn)',idle:'var(--amber)'}[x.key])+'"></i>').join('')+'<i style="flex:'+(100-(dScore||0))+';background:var(--card2)"></i></div>'+
      '<div class="legend" style="margin:6px 0 0">'+dp.parts.map(x=>'<span><i style="background:'+({sleep:'var(--sleepc)',rec:'var(--green)',effort:'var(--strain)',steps:'var(--dawn)',idle:'var(--amber)'}[x.key])+'"></i>'+({sleep:'Sleep',rec:'Recovery',effort:'Effort',steps:'Steps',idle:'Not sitting'}[x.key])+' '+x.pts.toFixed(0)+'</span>').join('')+'</div><span class="tapmore">How is this calculated? \u203A</span></button>'+
    '<p class="why">'+whyLine(n)+'</p>'+

    '<div class="sec"><h3>Today</h3><div class="tiles two">'+
      '<button class="tile tap" data-sheet="strain"><div class="k">Cardio load today</div><div class="v">'+(sT!=null?Math.round(sT):'\u2013')+'</div><div class="batt"><i style="width:'+Math.min(100,100*(sT||0)/loadMax(n)).toFixed(1)+'%;background:var(--strain)"></i><b style="left:'+(50).toFixed(1)+'%;width:0;border-width:1px"></b></div><div class="sub2">'+((((H[n]||{}).base)||{}).load?'Your normal is '+Math.round(H[n].base.load)+'. Still counting.':'Still counting')+'</div></button>'+
      '<button class="tile tap" data-info="sleepneed"><div class="k">Sleep goal tonight</div><div class="v">'+(sn?hm(sn.need):'\u2013')+'</div><div class="sub2">'+(sn&&sn.debt>=30?'Includes catch-up for a short week':'Your usual, plus any catch-up')+'</div></button>'+
      '<button class="tile tap" data-sheet="steps"><div class="k">Steps today</div><div class="v">'+(todayRow(n).steps!=null?Math.round(todayRow(n).steps).toLocaleString():'\u2013')+'</div><div class="sub2">Still counting</div></button>'+
    '</div></div>'+
    nx+
    '<div class="sec"><h3>Last night\u2019s body signals</h3><div class="tiles">'+
      tile('hrv','HRV','Higher = more recovered',r.hrv,v=>Math.round(v),'ms',b.hrv,true)+
      tile('rhr','Resting HR','Lower = more recovered',r.rhr,v=>Math.round(v),'bpm',b.rhr,false)+
      tile('rr','Breathing','Jumps can mean a cold',r.rr,v=>v.toFixed(1),'/min',b.rr,null)+
      tile('asleep','Asleep','Time actually asleep',r.asleep,hm,'',b.dur,true)+
      tile('restor','Deep + REM','The repair stages',restor(r),hm,'',null,true)+
      tile('daily','Daily score','Tap for 30-day trend',r.daily,v=>Math.round(v),'',null,true)+
    '</div></div>'+
    '<div class="sec card"><h3>Recovery vs cardio load, last 14 days</h3>'+
      lines([{vals:days(14).map(k=>val('rec',n,k)),col:'var(--green)',bold:true},{vals:days(14).map(k=>{const s=val('strain',n,k);return s==null?null:Math.min(100,s*100/loadMax(n));}),col:'var(--strain)',bold:true}],days(14),120)+
      '<div class="legend"><span><i style="background:var(--green)"></i>Recovery %</span><span><i style="background:var(--strain)"></i>Cardio load (100 = twice your normal)</span></div></div>';
}

/* ---------- Family ---------- */

  const top=famRank('daily',k)[0]; if(top) add('<b>'+esc(top[0])+'</b> won the day with a '+Math.round(top[1])+' daily score.',longDay(k));
  pairings(k).pairs.forEach(([a,b])=>{ const r=result(a,b,k); if(r&&!r.tie) add('<b>'+esc(r.w)+'</b> beat '+esc(r.l)+(r.sa!=null&&r.sb!=null?' '+Math.round(Math.max(r.sa,r.sb))+' to '+Math.round(Math.min(r.sa,r.sb)):' (no reading from '+esc(r.l)+')')+'.',longDay(k)); });
  names.forEach(n=>{ const g=streak(n,x=>x.rec!=null&&x.rec>=67); if(g>=3) add('<b>'+esc(n)+'</b> is on a '+g+'-day green recovery streak.',longDay(k));
    const r=rec(n,k), all=Object.values((H[n]||{}).days||{});
    const best=f=>{ const v=f(r); const vs=all.map(f).filter(x=>x!=null); return v!=null&&vs.length>=7&&v>=Math.max.apply(null,vs); };
    if (best(x=>x.hrv)) add('<b>'+esc(n)+'</b> hit a 30-day high HRV of '+Math.round(r.hrv)+' ms.',longDay(k));
    if (best(x=>x.asleep)) add('<b>'+esc(n)+'</b> logged the longest sleep of the month: '+hm(r.asleep)+'.',longDay(k)); });
  const tdy=(D.today||[]).slice().sort((a,b)=>(b.steps||0)-(a.steps||0))[0]; if(tdy&&tdy.steps) add('Right now <b>'+esc(tdy.name)+'</b> leads today\u2019s step race at '+Number(tdy.steps).toLocaleString()+'.','Today');
  const pts=(D.points||[])[0]; if(pts) add('<b>'+esc(pts[0])+'</b> leads the week with '+pts[1]+' points.','This week');
  const sms='sms:?&body='+encodeURIComponent((top?top[0]+' won yesterday. ':'')+'Who\u2019s taking today? '+location.href.split('#')[0]);
  const boards={daily:'Daily',rec:'Recovery',strain:'Load',sleep:'Sleep',steps:'Steps'};
  const cards=names.map(n=>{ const r=rec(n,k), st=strainOf(r);
    return '<button class="mem tap'+(n===me?' me':'')+'" data-view="'+esc(n)+'"><div class="rt"><span class="n">'+esc(n)+'</span><span class="dim" style="font-size:.8rem">'+(r.daily!=null?'Daily '+Math.round(r.daily):'no reading')+'</span></div>'+
      '<div class="minis">'+ring(r.sleep,100,52,5,band(r.sleep),r.sleep==null?'\u2013':Math.round(r.sleep))+ring(r.rec,100,52,5,band(r.rec),r.rec==null?'\u2013':Math.round(r.rec))+ring(st,loadMax(n),52,5,'var(--strain)',st==null?'\u2013':Math.round(st))+'</div>'+
      '<div class="minil"><span>Sleep</span><span>Recov.</span><span>Load</span></div>'+
      '<div class="meta" style="margin-top:6px">'+(r.steps!=null?Math.round(r.steps).toLocaleString()+' steps':'no steps')+'</div></button>'; }).join('');
  return '<h2>Family</h2><p class="note">Everyone\u2019s day at a glance. Tap anyone to open their day.</p>'+
    '<div class="memgrid">'+cards+'</div>'+
    '<div class="sec"><div class="rt"><h3>Leaderboard, '+longDay(k)+'</h3>'+info(board==='daily'?'daily':board,'this')+'</div><div class="seg">'+Object.keys(boards).map(x=>'<button data-board="'+x+'" aria-pressed="'+(board===x)+'">'+boards[x]+'</button>').join('')+'</div>'+
    '<div class="card">'+famBars(board,k)+'</div></div>'+
    '<div class="card sec"><h3>Family feed</h3><div class="feed">'+feed.map(f=>'<div class="msg"><span class="av" style="background:var(--strain)">\u2605</span><div class="bub"><div class="tx">'+f.t+'</div><div class="when">'+esc(f.when)+'</div></div></div>').join('')+'</div>'+
    '<a class="trash" href="'+sms+'">Talk trash in the group text</a></div>';
}

/* ---------- 1v1 ---------- */
function h2h_tab(){
  if (!DAY) return '';
  const focus=view||me, y=pairings(DAY), t=record();
  const order=y.pairs.slice().sort((p,q)=>(q.includes(focus)?1:0)-(p.includes(focus)?1:0));
  const rows=order.map(([a,b])=>{ const r=result(a,b,DAY);
    const side=(x,s,c)=>{ const st=!r||r.tie?'':(r.w===x?'win':'lose'); const sc='<span class="sc">'+(s!=null?Math.round(s):'\u2013')+'</span>', nm='<span>'+(st==='win'?'<span class="crown">\u265B</span>':'')+esc(x)+'</span>';
      return '<span class="side '+c+' '+st+'">'+(c==='r'?sc+nm:nm+sc)+'</span>'; };
    const mid=!r?'no data':r.tie?'tie':(r.sa!=null&&r.sb!=null?'by '+Math.round(Math.abs(r.sa-r.sb)):'no-show');
    return '<button class="mu tap" data-mu="'+esc(a)+'|'+esc(b)+'">'+side(a,rec(a,DAY).daily,'l')+'<span class="mid">'+mid+'<br>\u203A</span>'+side(b,rec(b,DAY).daily,'r')+'</button>'; }).join('');
  const nt=pairings(TODAY);
  const live=nt.pairs.map(([a,b])=>{ const sa=strainToday(a), sb=strainToday(b), xa=todayRow(a).steps, xb=todayRow(b).steps;
    const lead = sa!=null&&sb!=null&&sa!==sb ? (sa>sb?a:b) : null;
    return '<div class="mu'+((a===focus||b===focus)?' mine':'')+'"><span class="side l'+(lead===b?' lose':'')+'"><span>'+esc(a)+'</span><span class="sc" style="font-size:1rem">'+(sa!=null?Math.round(sa):'\u2013')+'</span></span><span class="mid">load<br>so far</span><span class="side r'+(lead===a?' lose':'')+'"><span class="sc" style="font-size:1rem">'+(sb!=null?Math.round(sb):'\u2013')+'</span><span>'+esc(b)+'</span></span></div>'; }).join('');
  const rk=names.slice().sort((a,b)=>{ const pa=t[a].w/Math.max(1,t[a].w+t[a].l), pb=t[b].w/Math.max(1,t[b].w+t[b].l); return pb-pa||t[b].w-t[a].w; });
  const pair={}; for (let i=0;i<30;i++){ const d=addDays(DAY,-i); pairings(d).pairs.forEach(([a,b])=>{ const r=result(a,b,d); if(!r||r.tie) return; const kk=r.w+'|'+r.l; pair[kk]=(pair[kk]||0)+1; }); }
  const grid='<div class="mx" style="grid-template-columns:70px repeat('+names.length+',1fr)"><span></span>'+names.map(n=>'<span class="h">'+esc(n.slice(0,3))+'</span>').join('')+
    names.map(a=>'<span class="h r">'+esc(a)+'</span>'+names.map(b=>{ if(a===b) return '<span class="c x"></span>'; const w=pair[a+'|'+b]||0, l=pair[b+'|'+a]||0; return '<span class="c'+(w>l?' w':l>w?' l':'')+'">'+(w+l?w+'\u2013'+l:'\u00b7')+'</span>'; }).join('')).join('')+'</div>';
  return '<div class="rt"><h2>1v1</h2>'+info('h2h','1v1')+'</div><p class="note">New opponent every day. Higher daily score wins.</p>'+
    '<div class="card"><h3>Today, live</h3>'+live+(nt.bye?'<p class="note" style="margin:8px 0 0">'+esc(nt.bye)+' has a bye.</p>':'')+'<div class="meta">Cardio load so far today. The final result is the daily score, which uses tonight\u2019s sleep too.</div></div>'+
    '<div class="card sec"><h3>'+longDay(DAY)+' results</h3>'+rows+(y.bye?'<p class="note" style="margin:8px 0 0">'+esc(y.bye)+' had a bye.</p>':'')+'<div class="meta">Tap a matchup for the stat-by-stat.</div></div>'+
    '<div class="card sec"><h3>Standings, last 30 days</h3><table class="t">'+rk.map(n=>{ const x=t[n],g=x.w+x.l;
      return '<tr class="'+(n===focus?'me':'')+'"><td>'+esc(n)+(x.streak>=2?' <span class="chip hot" style="padding:2px 7px">'+x.streak+'W streak</span>':'')+'</td><td class="r">'+x.w+'\u2013'+x.l+(x.t?'\u2013'+x.t:'')+'</td><td class="b">'+(g?Math.round(100*x.w/g)+'%':'\u2013')+'</td></tr>'; }).join('')+'</table></div>'+
    '<div class="card sec"><h3>Rivalries, last 30 days</h3><p class="note">Row player\u2019s record against each column player.</p>'+grid+'</div>';
}

/* ---------- Week ---------- */
function week_tab(){
  const focus=view||me, pts=D.points||[];
  const top=pts.length?Math.max.apply(null,pts.map(x=>Math.max(0,x[1]))):1;
  const race=pts.map((x,i)=>'<button class="row tap'+(x[0]===focus?' me':'')+'" data-view="'+esc(x[0])+'"><div class="rt"><span class="n"><span class="rank">'+(i+1)+'</span>'+esc(x[0])+'</span><span class="v">'+x[1]+'</span></div><div class="bar"><i style="width:'+(100*Math.max(0,x[1])/(top||1)).toFixed(1)+'%;background:'+(i===0?'var(--dawn)':'var(--text)')+'"></i></div></button>').join('');
  const dn=D.day_n||0, left=7-dn;
  const mine=pts.find(x=>x[0]===focus), lead=pts[0];
  let gap=''; if (mine&&lead&&mine[0]!==lead[0]) gap='<div class="card sec"><h3>'+esc(focus)+'\u2019s gap</h3><div class="big2">'+(Math.round((lead[1]-mine[1])*10)/10)+' pts</div><div class="meta">behind '+esc(lead[0])+' with '+left+' day'+(left===1?'':'s')+' left. Sleep Score and Recovery count double, so strong nights close the gap fastest.</div></div>';
  else if (mine&&lead) gap='<div class="card sec"><h3>'+esc(focus)+' leads</h3><div class="big2">+'+(pts[1]?Math.round((mine[1]-pts[1][1])*10)/10:0)+' pts</div><div class="meta">ahead of '+(pts[1]?esc(pts[1][0]):'everyone')+'.</div></div>';
  const box=c=>'<div class="cat'+(c.penalty?' pen':'')+'"><h4>'+esc(c.label)+(c.penalty?' (minus)':'')+'</h4>'+(c.entries.length?'<ol>'+c.entries.slice(0,3).map(e=>'<li><span>'+esc(e[0])+'</span><span>'+esc(e[1])+'</span></li>').join('')+'</ol>':'<p class="note" style="margin:0">Nobody yet</p>')+'</div>';
  return '<div class="rt"><h2>Race for the week</h2>'+info('points','points')+'</div><p class="note">Day '+dn+' of 7. '+(left>0?left+' day'+(left===1?'':'s')+' left. ':'')+'Champion crowned Sunday.</p>'+
    '<div class="card">'+race+'</div>'+gap+'<div class="sec"><h3>Categories</h3><div class="cats">'+(D.categories||[]).map(box).join('')+'</div></div>';
}

/* ---------- detail sheets ---------- */
function statsRow(m, n, keys){
  const vs=keys.map(k=>val(m,n,k)), have=vs.filter(v=>v!=null);
  const fr=famRank(m,DAY), pos=fr.findIndex(x=>x[0]===n);
  const hi=M[m].hi!==false;
  const best=have.length?(hi?Math.max:Math.min).apply(null,have):null;
  const st=(k,v)=>'<div class="stat"><div class="v">'+v+'</div><div class="k">'+k+'</div></div>';
  return '<div class="stats">'+st(range+'d avg',have.length?M[m].fmt(avg(have)):'\u2013')+st('Best',best!=null?M[m].fmt(best):'\u2013')+st('Readings',have.length+'/'+keys.length)+st('Family',pos>=0?ord(pos+1):'\u2013')+'</div>';
}
function rangeSeg(){ return '<div class="seg" style="margin-top:14px">'+[7,14,30].map(d=>'<button data-range="'+d+'" aria-pressed="'+(range===d)+'">'+d+' days</button>').join('')+'</div>'; }

function sheetHtml(m, n){
  const keys=days(range), r=rec(n,DAY), b=base(n), det=detailOf(n)||{};
  const v=val(m,n,DAY);
  const head='<button class="back" data-close="1">\u2190 Back</button>'+
    '<div class="hd"><div class="k">'+esc(n)+'\u2019s '+M[m].label+'</div><div class="big" style="color:'+(v==null?'var(--faint)':M[m].col(v))+'">'+(v==null?'\u2013':M[m].fmt(v))+'</div><div class="s">'+longDay(DAY)+'</div>'+(['daily','sleep','rec','strain','hrv','rhr','rr','asleep','restor','steps'].includes(m)?'<button class="tapmore" style="margin-top:8px" data-info="'+m+'">What is this and how is it calculated? \u203A</button>':'')+'</div>';
  const vals=keys.map(k=>val(m,n,k));
  let body=rangeSeg()+'<div class="card"><h3>'+range+'-day trend</h3>'+bars(vals,keys,x=>M[m].col(x),M[m].max,avg(vals))+'<div class="legend"><span><i style="background:var(--muted)"></i>dashed line is your '+range+'-day average</span></div></div>'+statsRow(m,n,keys);
  if (m==='rec'){
    body+='<div class="card sec"><h3>What drove it</h3>'+
      devRow('HRV',r.hrv,b.hrv,x=>Math.round(x)+' ms',true)+
      devRow('Resting heart rate',r.rhr,b.rhr,x=>Math.round(x)+' bpm',false)+
      devRow('Respiratory rate',r.rr,b.rr,x=>x.toFixed(1)+' rpm',null)+
      devRow('Sleep',r.asleep,b.dur,hm,true)+'</div>';
    body+='<div class="card sec"><h3>HRV and resting HR, '+range+' days</h3>'+lines([{vals:keys.map(k=>val('hrv',n,k)),col:'var(--green)',bold:true}],keys,110)+lines([{vals:keys.map(k=>val('rhr',n,k)),col:'var(--red)',bold:true}],keys,90)+'<div class="legend"><span><i style="background:var(--green)"></i>HRV</span><span><i style="background:var(--red)"></i>Resting HR</span></div></div>';
  }
  if (m==='sleep' || m==='asleep' || m==='restor'){
    const need=b.dur; const debt=need?days(7).reduce((s,k)=>{const a=val('asleep',n,k); return s+(a==null?0:Math.max(0,need-a));},0):null;
    body+='<div class="card sec"><h3>Stages by night</h3>'+stageBars(n,days(Math.min(range,14)))+'<div class="legend"><span><i style="background:var(--deepc)"></i>Deep</span><span><i style="background:var(--remc)"></i>REM</span><span><i style="background:var(--lightc)"></i>Light</span><span>dashed is your usual</span></div></div>';
    body+='<div class="card sec"><h3>Last night</h3>'+
      devRow('Hours asleep',r.asleep,need,hm,true,need?'Your usual is '+hm(need):null)+
      devRow('Deep sleep',r.deep,null,hm,true,r.asleep&&r.deep!=null?Math.round(100*r.deep/r.asleep)+'% of the night':null)+
      devRow('REM sleep',r.rem,null,hm,true,r.asleep&&r.rem!=null?Math.round(100*r.rem/r.asleep)+'% of the night':null)+
      devRow('Efficiency',r.effp,null,x=>Math.round(x)+'%',true,'Share of time in bed actually asleep')+
      (debt!=null?devRow('Sleep debt, last 7 nights',debt,null,hm,false,'Time short of your usual, added up'):'')+'</div>';
    if (det.sleep_parts&&det.sleep_parts.length) body+='<div class="card sec"><h3>Sleep score breakdown</h3>'+det.sleep_parts.map(x=>'<div class="contrib"><span class="n">'+esc(x[0])+'</span><span class="m">'+esc(x[1])+'</span></div>').join('')+'</div>';
  }
  if (m==='strain' || m==='steps' || m==='load'){
    body+='<div class="card sec"><h3>Yesterday\u2019s activity</h3>'+
      devRow('Cardio load',r.load,null,x=>Math.round(x),true,'Time in heart-rate zones, harder zones count more')+
      devRow('Steps',r.steps,null,x=>Math.round(x).toLocaleString(),true)+
      devRow('Workouts',r.wk||0,null,x=>String(x),true)+'</div>';
    body+='<div class="card sec"><h3>Recovery vs cardio load</h3>'+lines([{vals:keys.map(k=>val('rec',n,k)),col:'var(--green)',bold:true},{vals:keys.map(k=>{const s=val('strain',n,k);return s==null?null:Math.min(100,s*100/loadMax(n));}),col:'var(--strain)',bold:true}],keys,120)+'<div class="legend"><span><i style="background:var(--green)"></i>Recovery %</span><span><i style="background:var(--strain)"></i>Strain (scaled)</span></div></div>';
    if (det.activity&&det.activity.length) body+='<div class="card sec"><h3>Activity breakdown</h3>'+det.activity.map(x=>'<div class="contrib"><span class="n">'+esc(x[0])+'</span><span class="v" style="font-family:var(--font);font-weight:400;color:var(--muted)">'+esc(x[1])+'</span></div>').join('')+'</div>';
  }
  if (m==='rec' && det.rec_parts&&det.rec_parts.length) body+='<div class="card sec"><h3>Recovery breakdown</h3>'+det.rec_parts.map(x=>'<div class="contrib"><span class="n">'+esc(x[0])+'</span><span class="m">'+esc(x[1])+'</span></div>').join('')+'</div>';
  body+='<div class="card sec"><h3>Family, '+longDay(DAY)+'</h3>'+famBars(m,DAY)+'</div>';
  body+='<div class="card sec"><h3>Family trend, '+range+' days</h3>'+lines(names.map(x=>({vals:keys.map(k=>val(m,x,k)),col:colorOf(x),bold:x===n})),keys,150)+
    '<div class="legend" style="flex-wrap:wrap">'+names.map(x=>'<span><i style="background:'+colorOf(x)+'"></i>'+esc(x)+'</span>').join('')+'</div></div>';
  return head+body;
}

function muHtml(a,b){
  const k=DAY, r=result(a,b,k);
  const ms=['daily','rec','sleep','strain','hrv','rhr','asleep','restor','steps'];
  let wa=0,wb=0;
  const rows=ms.map(m=>{ const va=val(m,a,k), vb=val(m,b,k); let w=null;
    if (va!=null&&vb!=null&&va!==vb){ const hi=M[m].hi!==false; w=(hi?va>vb:va<vb)?a:b; if(w===a)wa++; else wb++; }
    const mx=Math.max(va||0,vb||0)||1;
    return '<div class="contrib"><span class="n">'+M[m].label+'</span><span class="v"></span>'+
      '<span class="m" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        '<span><span style="font-weight:700;color:'+(w===a?'var(--green)':'var(--muted)')+'">'+(va==null?'\u2013':M[m].fmt(va))+'</span><span class="bar"><i style="margin-left:auto;width:'+(100*(va||0)/mx).toFixed(1)+'%;background:'+colorOf(a)+'"></i></span></span>'+
        '<span style="text-align:right"><span style="font-weight:700;color:'+(w===b?'var(--green)':'var(--muted)')+'">'+(vb==null?'\u2013':M[m].fmt(vb))+'</span><span class="bar"><i style="width:'+(100*(vb||0)/mx).toFixed(1)+'%;background:'+colorOf(b)+'"></i></span></span>'+
      '</span></div>'; }).join('');
  const k30=days(30); let ha=0,hb=0;
  k30.forEach(d=>{ pairings(d).pairs.forEach(([x,y])=>{ if((x===a&&y===b)||(x===b&&y===a)){ const rr=result(x,y,d); if(rr&&!rr.tie){ if(rr.w===a)ha++; else hb++; } } }); });
  return '<button class="back" data-close="1">\u2190 Back</button>'+
    '<div class="hd"><div class="k">'+longDay(k)+'</div><div class="big" style="font-size:2.2rem">'+esc(a)+' vs '+esc(b)+'</div>'+
    '<div class="s">'+(r&&!r.tie?esc(r.w)+' won'+(r.sa!=null&&r.sb!=null?', '+Math.round(Math.max(r.sa,r.sb))+' to '+Math.round(Math.min(r.sa,r.sb)):''):r&&r.tie?'Tie':'No result')+'</div></div>'+
    '<div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="v">'+wa+'\u2013'+wb+'</div><div class="k">Stats won</div></div><div class="stat"><div class="v">'+ha+'\u2013'+hb+'</div><div class="k">Head to head</div></div><div class="stat"><div class="v">'+((record()[a]||{}).w||0)+' vs '+((record()[b]||{}).w||0)+'</div><div class="k">Wins, 30 days</div></div></div>'+
    '<div class="card sec"><h3>Stat by stat</h3><div class="legend"><span><i style="background:'+colorOf(a)+'"></i>'+esc(a)+'</span><span><i style="background:'+colorOf(b)+'"></i>'+esc(b)+'</span></div>'+rows+'</div>'+
    '<div class="card sec"><h3>Daily score, last 14 days</h3>'+lines([{vals:days(14).map(d=>val('daily',a,d)),col:colorOf(a),bold:true},{vals:days(14).map(d=>val('daily',b,d)),col:colorOf(b),bold:true}],days(14),130)+'</div>';
}

/* ---------- shell ---------- */
const ICONS={home:'<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>',
  team:'<circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5M15 15c2.5-.3 4.5.9 5.3 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  h2h:'<path d="M5 5l6 6M5 11l6-6M13 13l6 6M13 19l6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  week:'<path d="M5 20V10M10 20V4M15 20v-7M20 20v-4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'};
function nav(){ const L={home:'Me',team:'Family',h2h:'1v1',week:'Week'};
  return '<nav class="tabs"><div class="in">'+Object.keys(L).map(t=>'<button data-tab="'+t+'" aria-pressed="'+(tab===t)+'"><svg viewBox="0 0 24 24">'+ICONS[t]+'</svg>'+L[t]+'</button>').join('')+'</div></nav>'; }
function picker(){ return '<section class="pick"><h1>Who are you?</h1><p class="note">Pick your name once. This page will open on your day every time.</p><div class="grid">'+names.map(n=>'<button data-me="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div></section>'; }

function render(keepScroll){
  const app=document.getElementById('app'); let h='';
  if (!me && !view && tab==='home') h+=header()+winStrip()+picker();
  else {
    h+=header()+winStrip();
    if (tab==='home') h+=me_tab();
    if (tab==='team') h+=family_tab();
    if (tab==='h2h') h+=h2h_tab();
    if (tab==='week') h+=week_tab();
  }
  h+='<footer>Tap any number to see what it means and how it is calculated. Sleep counts under the night it began.'+(me?' <button data-forget="1" style="text-decoration:underline">Not '+esc(me)+'?</button>':'')+'</footer>';
  h+=nav();
  if (sheet) h+='<div class="sheet" role="dialog" aria-modal="true"><div class="in">'+(sheet.info?explain(sheet.info,sheet.n):sheet.mu?muHtml(sheet.mu[0],sheet.mu[1]):sheetHtml(sheet.m, sheet.n))+'</div></div>';
  app.innerHTML=h;
  document.body.style.overflow = sheet ? 'hidden' : '';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.ring .arc').forEach(a=>a.setAttribute('stroke-dashoffset',a.getAttribute('data-off')));
    const sel=document.querySelector('.who button[aria-pressed="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'center'});
  }));
  if (!keepScroll && !sheet) window.scrollTo({top:0});
}

document.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  const d=t.dataset;
  if (d.me){ me=d.me; view=me; tab='home'; try{localStorage.setItem(KEY,me);}catch(_){} render(); }
  else if (d.forget){ me=null; view=null; tab='home'; try{localStorage.removeItem(KEY);}catch(_){} render(); }
  else if (d.close){ sheet=(sheet&&sheet.prev)||null; render(true); }
  else if (d.range){ range=+d.range; const sc=document.querySelector('.sheet').scrollTop; render(true); const s=document.querySelector('.sheet'); if(s) s.scrollTop=sc; }
  else if (d.info){ const who=(sheet&&sheet.n)||view||me||names[0]; sheet={info:d.info,n:who,prev:sheet&&!sheet.info?sheet:null}; render(true); const s=document.querySelector('.sheet'); if(s) s.scrollTop=0; }
  else if (d.sheet){ if(!view) return; sheet={m:d.sheet,n:view}; render(true); }
  else if (d.mu){ sheet={mu:d.mu.split('|')}; render(true); }
  else if (d.board){ board=d.board; render(true); }
  else if (d.view){ view=d.view; sheet=null; tab='home'; render(); }
  else if (d.tab){ tab=d.tab; if(tab==='home'&&!view) view=me; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && sheet){ sheet=null; render(true); } });
render();
})();
</script>
</body></html>
