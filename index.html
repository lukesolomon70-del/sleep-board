<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#151A30">
<title>Family leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --night:#151A30; --deep:#1E2442; --raise:#262D52; --line:#323A63;
  --text:#EEF0F8; --muted:#97A0C2; --faint:#5E6790;
  --green:#4FD18B; --amber:#F3B53F; --red:#F2625E; --dawn:#F7A88B;
  --deepc:#5B6CF0; --remc:#9C7BF2; --lightc:#3D4675;
  --font:'Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif;
  --disp:'Bricolage Grotesque','Atkinson Hyperlegible',ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --night:#F1F2F8; --deep:#FFFFFF; --raise:#E7E9F4; --line:#D9DCEB;
    --text:#161A2E; --muted:#5B6385; --faint:#9AA1BF;
    --green:#17955A; --amber:#B97A06; --red:#CF3B37; --dawn:#C9603E;
    --deepc:#4152D9; --remc:#7D58DE; --lightc:#C9CEE6;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--night);color:var(--text);font-family:var(--font);
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{max-width:640px;margin:0 auto;padding:18px 18px 64px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:2px solid var(--dawn);outline-offset:3px;border-radius:6px}
h2{font-family:var(--disp);font-weight:700;font-size:1.45rem;line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
.sec{margin-top:44px}
.note{color:var(--muted);font-size:.9rem;margin:0 0 14px}

/* who strip */
.who{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who button{flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--deep);
  border:1px solid var(--line);color:var(--muted);font-weight:700;font-size:.92rem}
.who button[aria-pressed="true"]{background:var(--text);color:var(--night);border-color:var(--text)}
.who button .me{font-weight:400;opacity:.7;margin-left:4px}

/* hero */
.hero{margin-top:10px;background:var(--deep);border-radius:28px;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:auto -30% -60% -30%;height:120%;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--glow,var(--faint)) 22%,transparent),transparent);pointer-events:none}
.hero > *{position:relative}
.greet{font-family:var(--disp);font-weight:800;font-size:2rem;line-height:1.05;letter-spacing:-.02em;margin:0}
.when{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.rings{display:grid;grid-template-columns:1.35fr 1fr;gap:12px;align-items:center;margin:18px 0 6px}
.big{display:flex;flex-direction:column;align-items:center}
.small{display:grid;gap:12px}
.mini{display:flex;align-items:center;gap:12px}
.ring{display:block}
.ring .trk{stroke:var(--raise)}
.ring .arc{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.rlab{font-size:.85rem;color:var(--muted);margin-top:2px;text-align:center}
.mini .t{font-weight:700}
.mini .s{color:var(--muted);font-size:.85rem;white-space:nowrap}
.why{font-size:1.02rem;margin:14px 0 0}
.why b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:5px 11px;border-radius:999px;background:var(--raise);font-size:.85rem;font-weight:700}
.chip.hot{background:color-mix(in srgb,var(--dawn) 22%,var(--raise));color:var(--text)}
.claim{margin-top:16px;width:100%;padding:12px;border-radius:14px;background:var(--text);color:var(--night);font-weight:700}
details.more{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;color:var(--muted);font-size:.92rem;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:" +";}
details.more[open] summary::after{content:" \2212";}
.pr{display:flex;justify-content:space-between;gap:14px;padding:4px 0;font-size:.9rem}
.pr span:last-child{color:var(--muted);text-align:right}
.ph{font-weight:700;font-size:.9rem;margin:12px 0 2px}

/* picker */
.pick h1{font-family:var(--disp);font-weight:800;font-size:2.1rem;line-height:1.05;margin:6px 0 8px;letter-spacing:-.02em}
.pick p{color:var(--muted);margin:0 0 18px}
.pick .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.pick .grid button{padding:16px;border-radius:18px;background:var(--deep);border:1px solid var(--line);font-family:var(--disp);font-weight:700;font-size:1.15rem;text-align:left}

/* matchups */
.next{background:var(--deep);border-radius:18px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.next .vs{font-family:var(--disp);font-weight:700;font-size:1.15rem}
.next .tip{color:var(--muted);font-size:.85rem}
.mu{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.mu:last-child{border-bottom:0}
.side{display:flex;align-items:baseline;gap:10px}
.side.r{justify-content:flex-end;text-align:right}
.side .nm{font-weight:700}
.side .sc{font-family:var(--disp);font-weight:700;font-size:1.35rem}
.side.lose{color:var(--muted)}
.side.lose .sc{color:var(--faint)}
.side.win .sc{color:var(--green)}
.mu .mid{color:var(--faint);font-size:.8rem;text-align:center;min-width:52px}
.mu.mine{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--dawn) 10%,transparent),transparent)}
.bye{color:var(--muted);font-size:.9rem;padding-top:10px}
table.rec{width:100%;border-collapse:collapse;margin-top:6px;font-size:.95rem}
table.rec td{padding:7px 0;border-bottom:1px solid var(--line)}
table.rec td.n{text-align:right;color:var(--muted);width:72px}
table.rec td.w{text-align:right;font-weight:700;width:64px}
table.rec tr.mine td{color:var(--text)}
table.rec tr.mine td:first-child{font-weight:700}
.nmb{font-weight:700;text-align:left}
.nmb:hover{text-decoration:underline;text-underline-offset:3px}

/* bars */
.row{padding:10px 0}
.row.mine .top .nmb{color:var(--dawn)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.val{font-family:var(--disp);font-weight:700;font-size:1.1rem}
.meta{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.bar{display:flex;height:12px;border-radius:7px;background:var(--raise);overflow:hidden;margin:7px 0 5px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.dim{color:var(--faint)}

/* week */
.race .bar{height:16px}
.race .bar i{background:var(--text);opacity:.85;border-radius:8px}
.race .row.first .bar i{background:var(--dawn);opacity:1}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cat{background:var(--deep);border-radius:16px;padding:12px 14px}
.cat h3{margin:0 0 6px;font-size:.9rem;font-weight:700;color:var(--muted)}
.cat ol{margin:0;padding:0;list-style:none;font-size:.9rem}
.cat li{display:flex;justify-content:space-between;gap:8px;padding:1px 0}
.cat li:first-child{font-weight:700}
.cat li span:last-child{color:var(--muted);font-weight:400;text-align:right}
.cat.pen h3{color:var(--red)}
details.all{margin-top:12px}
details.all summary{cursor:pointer;color:var(--muted);font-size:.92rem;padding:8px 0}

/* trend */
.trend{display:flex;align-items:flex-end;gap:4px;height:90px;margin:8px 0 4px}
.trend i{flex:1;border-radius:4px 4px 2px 2px;min-height:4px;background:var(--raise)}
.tl{display:flex;justify-content:space-between;color:var(--faint);font-size:.78rem}

footer{margin-top:48px;color:var(--faint);font-size:.82rem}
@media (max-width:420px){
  .greet{font-size:1.7rem}
  .cats{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){ .ring .arc{transition:none} }
</style></head>

<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const H = D.history || {};
const KEY = 'sleepboard_me';
let me = null; try { me = localStorage.getItem(KEY); } catch(e) {}
const names = Array.from(new Set([].concat(Object.keys(H), (D.detail||[]).map(x=>x.name), (D.sleep||[]).map(x=>x.name)))).sort();
if (me && !names.includes(me)) me = null;
let view = me;

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const band = v => v==null ? 'var(--faint)' : v>=67 ? 'var(--green)' : v>=34 ? 'var(--amber)' : 'var(--red)';
const hm = m => m==null ? '' : Math.floor(m/60)+'h '+String(Math.round(m%60)).padStart(2,'0')+'m';
const ord = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
const iso = d => d.toISOString().slice(0,10);
const addDays = (s,n) => { const d=new Date(s+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const DAY = D.day_iso || (()=>{ let best=null; for (const n in H) for (const k in H[n].days) if(!best||k>best) best=k; return best; })();
const TODAY = DAY ? addDays(DAY,1) : null;
const rec = (n,k) => (H[n] && H[n].days[k]) || {};
const detailOf = n => (D.detail||[]).find(x=>x.name===n);
const nameBtn = n => '<button class="nmb" data-view="'+esc(n)+'">'+esc(n)+'</button>';

/* ---------- matchups ---------- */
function pairings(dayIso){
  const list = names.slice();
  if (list.length < 2) return {pairs:[], bye:null};
  if (list.length % 2) list.push(null);
  const m = list.length, rounds = m - 1;
  const idx = Math.round((Date.parse(dayIso+'T12:00:00Z') - Date.parse('2026-01-01T12:00:00Z'))/864e5);
  const r = ((idx % rounds) + rounds) % rounds;
  const rest = list.slice(1);
  const rot = rest.slice(r).concat(rest.slice(0,r));
  const arr = [list[0]].concat(rot);
  const pairs=[]; let bye=null;
  for (let i=0;i<m/2;i++){
    const a=arr[i], b=arr[m-1-i];
    if (a===null) bye=b; else if (b===null) bye=a; else pairs.push([a,b]);
  }
  return {pairs, bye};
}
function result(a,b,k){
  const sa = rec(a,k).daily, sb = rec(b,k).daily;
  if (sa==null && sb==null) return null;
  if (sb==null) return {w:a,l:b,sa,sb};
  if (sa==null) return {w:b,l:a,sa,sb};
  if (sa===sb) return {tie:true,sa,sb};
  return sa>sb ? {w:a,l:b,sa,sb} : {w:b,l:a,sa,sb};
}
function record(){
  const t={}; names.forEach(n=>t[n]={w:0,l:0,t:0});
  if (!DAY) return t;
  for (let i=0;i<30;i++){
    const k = addDays(DAY,-i);
    pairings(k).pairs.forEach(([a,b])=>{
      const r=result(a,b,k); if(!r) return;
      if (r.tie){ t[a].t++; t[b].t++; } else { t[r.w].w++; t[r.l].l++; }
    });
  }
  return t;
}

/* ---------- streaks ---------- */
function streak(n, test){
  let s=0; if(!DAY) return 0;
  for (let i=0;i<60;i++){ const r=rec(n,addDays(DAY,-i)); if(test(r)) s++; else break; }
  return s;
}

/* ---------- rings ---------- */
function ring(v, size, sw, glow){
  const r=(size-sw)/2, c=2*Math.PI*r, pct=v==null?0:Math.max(0,Math.min(100,v))/100;
  const col=band(v);
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+(v==null?'no reading':Math.round(v)+' of 100')+'">'+
    '<circle class="trk" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke-width="'+sw+'"/>'+
    '<circle class="arc" cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round"'+
    ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+c.toFixed(1)+'" data-off="'+(c*(1-pct)).toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="currentColor" style="font-family:var(--disp);font-weight:800;font-size:'+(size*0.3)+'px">'+(v==null?'\u2013':Math.round(v))+'</text>'+
  '</svg>';
}

/* ---------- why line ---------- */
function whyLine(n){
  const r=rec(n,DAY), b=(H[n]||{}).base||{};
  const bits=[];
  if (r.asleep!=null && b.dur){
    const d=Math.round(r.asleep-b.dur);
    if (Math.abs(d)>=10) bits.push({w:Math.abs(d)/b.dur, t:'Slept <b>'+Math.abs(d)+' min '+(d>0?'more':'less')+'</b> than usual'});
    else bits.push({w:0.01, t:'Slept your usual <b>'+hm(r.asleep)+'</b>'});
  } else if (r.asleep!=null) bits.push({w:0.01,t:'Slept <b>'+hm(r.asleep)+'</b>'});
  if (r.hrv!=null && b.hrv){
    const p=Math.round(100*(r.hrv-b.hrv)/b.hrv);
    if (Math.abs(p)>=5) bits.push({w:Math.abs(p)/100, t:'HRV <b>'+Math.abs(p)+'% '+(p>0?'above':'below')+'</b> your normal'});
  }
  if (r.rhr!=null && b.rhr){
    const d=Math.round(r.rhr-b.rhr);
    if (Math.abs(d)>=2) bits.push({w:Math.abs(d)/b.rhr, t:'resting heart rate <b>'+Math.abs(d)+' bpm '+(d<0?'lower':'higher')+'</b> than normal'});
  }
  if (!bits.length) return r.daily==null ? 'No sleep or recovery reading for last night yet.' : '';
  bits.sort((a,b)=>b.w-a.w);
  const s=bits.slice(0,2).map(x=>x.t);
  s[0]=s[0].charAt(0).toUpperCase()+s[0].slice(1);
  if (s[1]) s[1]=s[1].charAt(0).toLowerCase()+s[1].slice(1);
  return s.join(', and ')+'.';
}

/* ---------- sections ---------- */
function whoStrip(){
  const ordered = me ? [me].concat(names.filter(n=>n!==me)) : names;
  return '<nav class="who" aria-label="Choose a person">'+ordered.map(n=>
    '<button data-view="'+esc(n)+'" aria-pressed="'+(n===view)+'">'+esc(n)+(n===me?'<span class="me">(you)</span>':'')+'</button>').join('')+'</nav>';
}

function picker(){
  return '<section class="pick"><h1>Who are you?</h1><p>Pick your name once. This page will open on your morning every time.</p><div class="grid">'+
    names.map(n=>'<button data-me="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div></section>';
}

function hero(n){
  const r=rec(n,DAY), det=detailOf(n);
  const rank = det && det.daily!=null ? ord(det.rank)+' of '+det.of+' yesterday' : 'Not ranked yesterday';
  const wear = streak(n, x=>x.asleep!=null);
  const green = streak(n, x=>x.rec!=null && x.rec>=67);
  const recs = Object.values((H[n]||{}).days||{}).map(x=>x.rec).filter(v=>v!=null);
  const best = r.rec!=null && recs.length>=7 && r.rec>=Math.max.apply(null,recs);
  const chips=[];
  if (wear>=2) chips.push('<span class="chip">'+wear+' nights worn in a row</span>');
  if (green>=2) chips.push('<span class="chip hot">'+green+' green days in a row</span>');
  if (best) chips.push('<span class="chip hot">Best recovery in 30 days</span>');
  const greet = n===me ? 'Good morning, '+esc(n) : esc(n)+'\u2019s morning';
  let more='';
  if (det){
    const part=(t,rows)=>rows&&rows.length?'<div class="ph">'+t+'</div>'+rows.map(x=>'<div class="pr"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>').join(''):'';
    more='<details class="more"><summary>Full breakdown</summary>'+part('Sleep',det.sleep_parts)+part('Recovery',det.rec_parts)+part('Activity',det.activity)+'</details>';
  }
  const claim = (me!==n) ? '<button class="claim" data-me="'+esc(n)+'">This is me</button>' : '';
  return '<section class="hero" style="--glow:'+band(r.rec)+'">'+
    '<h1 class="greet">'+greet+'</h1>'+
    '<p class="when">'+esc(D.day||'')+'<br>Daily score '+(r.daily!=null?'<b>'+Math.round(r.daily)+'</b>':'\u2013')+', '+rank+'</p>'+
    '<div class="rings"><div class="big">'+ring(r.rec,168,16)+'<div class="rlab">Recovery</div></div>'+
      '<div class="small">'+
        '<div class="mini">'+ring(r.sleep,74,8)+'<div><div class="t">Sleep</div><div class="s">'+(r.asleep!=null?hm(r.asleep):'no reading')+'</div></div></div>'+
        '<div class="mini">'+ring(r.effort,74,8)+'<div><div class="t">Effort</div><div class="s">'+(r.load!=null?'load '+Math.round(r.load):'vs your normal')+'</div></div></div>'+
      '</div></div>'+
    '<p class="why">'+whyLine(n)+'</p>'+
    (chips.length?'<div class="chips">'+chips.join('')+'</div>':'')+
    more+claim+
  '</section>';
}

function matchups(){
  if (!DAY || names.length<2) return '';
  const focus = view || me;
  const y = pairings(DAY);
  const order = y.pairs.slice().sort((p,q)=>(q.includes(focus)?1:0)-(p.includes(focus)?1:0));
  const rows = order.map(([a,b])=>{
    const r=result(a,b,DAY);
    const side=(x,s,cls)=>{
      const st = !r||r.tie ? '' : (r.w===x?'win':'lose');
      return '<div class="side '+cls+' '+st+'">'+(cls==='r'?'<span class="sc">'+(s!=null?Math.round(s):'\u2013')+'</span>'+nameBtn(x):nameBtn(x)+'<span class="sc">'+(s!=null?Math.round(s):'\u2013')+'</span>')+'</div>';
    };
    let mid='';
    if (!r) mid='no data';
    else if (r.tie) mid='tie';
    else if (r.sa!=null && r.sb!=null) mid='by '+Math.round(Math.abs(r.sa-r.sb));
    else mid='no-show';
    return '<div class="mu'+((a===focus||b===focus)?' mine':'')+'">'+side(a,rec(a,DAY).daily,'l')+'<div class="mid">'+mid+'</div>'+side(b,rec(b,DAY).daily,'r')+'</div>';
  }).join('');
  let next='';
  if (focus && TODAY){
    const t=pairings(TODAY);
    const p=t.pairs.find(x=>x.includes(focus));
    if (p){ const opp=p[0]===focus?p[1]:p[0];
      next='<div class="next"><div><div class="tip">Your next matchup</div><div class="vs">'+esc(focus)+' vs '+esc(opp)+'</div></div><div class="tip" style="text-align:right">Decided by tonight\u2019s sleep<br>and today\u2019s activity</div></div>';
    } else if (t.bye===focus) next='<div class="next"><div><div class="tip">Your next matchup</div><div class="vs">Bye day</div></div></div>';
  }
  const t=record();
  const rk = names.slice().sort((a,b)=>{
    const pa=t[a].w/Math.max(1,t[a].w+t[a].l), pb=t[b].w/Math.max(1,t[b].w+t[b].l);
    return pb-pa || t[b].w-t[a].w;
  });
  const table='<table class="rec">'+rk.map(n=>{
    const x=t[n], g=x.w+x.l;
    return '<tr class="'+(n===focus?'mine':'')+'"><td>'+nameBtn(n)+'</td><td class="n">'+x.w+'\u2013'+x.l+(x.t?'\u2013'+x.t:'')+'</td><td class="w">'+(g?Math.round(100*x.w/g)+'%':'\u2013')+'</td></tr>';
  }).join('')+'</table>';
  return '<section class="sec"><h2>Head to head</h2><p class="note">Everyone gets a new opponent every day. Higher daily score wins.</p>'+next+
    rows+(y.bye?'<div class="bye">'+esc(y.bye)+' had a bye.</div>':'')+
    '<h2 style="margin-top:30px;font-size:1.15rem">Record, last 30 days</h2>'+table+'</section>';
}

function lastNight(){
  const focus=view||me;
  const rows=(D.sleep||[]).filter(x=>x.minutes>0);
  const none=(D.sleep||[]).filter(x=>!(x.minutes>0)).map(x=>x.name);
  const body=rows.map(x=>{
    const r=rec(x.name,DAY), tot=Math.max(x.minutes,540);
    const deep=r.deep||0, rem=r.rem||0, light=Math.max(0,x.minutes-deep-rem);
    const w=v=>(100*v/tot).toFixed(1)+'%';
    const meta=[]; if(x.score!=null) meta.push('sleep score '+x.score); if(deep||rem) meta.push(hm(deep+rem)+' deep + REM'); if(x.eff) meta.push(Math.round(x.eff)+'% efficient');
    return '<div class="row'+(x.name===focus?' mine':'')+'"><div class="top">'+nameBtn(x.name)+'<span class="val">'+esc(x.asleep||'')+'</span></div>'+
      '<div class="bar">'+(deep||rem?'<i style="width:'+w(deep)+';background:var(--deepc)"></i><i style="width:'+w(rem)+';background:var(--remc)"></i><i style="width:'+w(light)+';background:var(--lightc)"></i>':'<i style="width:'+w(x.minutes)+';background:var(--lightc)"></i>')+'</div>'+
      '<div class="meta">'+meta.map(m=>'<span>'+esc(m)+'</span>').join('')+'</div></div>';
  }).join('');
  return '<section class="sec"><h2>Last night</h2><div class="legend"><span><i style="background:var(--deepc)"></i>Deep</span><span><i style="background:var(--remc)"></i>REM</span><span><i style="background:var(--lightc)"></i>Light</span></div>'+
    (body||'<p class="note">No nights synced yet.</p>')+
    (none.length?'<p class="note dim">No reading: '+none.map(esc).join(', ')+'</p>':'')+'</section>';
}

function todaySoFar(){
  const focus=view||me, rows=D.today||[];
  if (!rows.length) return '';
  const max=Math.max.apply(null, rows.map(x=>x.steps||0).concat([10000]));
  return '<section class="sec"><h2>Today so far</h2><p class="note">Steps race. Still counting, nothing scored until tonight.</p>'+rows.map(x=>{
    const meta=[]; if(x.load) meta.push('cardio load '+Math.round(x.load)); if(x.workouts) meta.push(x.workouts+' workout'+(x.workouts===1?'':'s'));
    return '<div class="row'+(x.name===focus?' mine':'')+'"><div class="top">'+nameBtn(x.name)+'<span class="val">'+(x.steps!=null?Number(x.steps).toLocaleString():'\u2013')+'</span></div>'+
      '<div class="bar"><i style="width:'+(100*(x.steps||0)/max).toFixed(1)+'%;background:var(--amber)"></i></div>'+
      (meta.length?'<div class="meta">'+meta.map(m=>'<span>'+esc(m)+'</span>').join('')+'</div>':'')+'</div>';
  }).join('')+'</section>';
}

function week(){
  const focus=view||me, pts=D.points||[];
  const top=pts.length?Math.max.apply(null,pts.map(x=>Math.max(0,x[1]))):1;
  const race=pts.map((x,i)=>'<div class="row'+(i===0?' first':'')+(x[0]===focus?' mine':'')+'"><div class="top">'+nameBtn(x[0])+'<span class="val">'+x[1]+'</span></div>'+
    '<div class="bar"><i style="width:'+(100*Math.max(0,x[1])/(top||1)).toFixed(1)+'%"></i></div></div>').join('');
  const day_n=D.day_n||0, left=7-day_n;
  const headline=['Sleep Score','Recovery','Effort','Steps'];
  const catBox=c=>'<div class="cat'+(c.penalty?' pen':'')+'"><h3>'+esc(c.label)+'</h3>'+
    (c.entries.length?'<ol>'+c.entries.slice(0,3).map(e=>'<li><span>'+esc(e[0])+'</span><span>'+esc(e[1])+'</span></li>').join('')+'</ol>':'<p class="note" style="margin:0">Nobody yet</p>')+'</div>';
  const cats=D.categories||[];
  const head=cats.filter(c=>headline.includes(c.label)), rest=cats.filter(c=>!headline.includes(c.label));
  return '<section class="sec"><h2>Race for the week</h2><p class="note">Day '+day_n+' of 7. '+(left>0?left+' day'+(left===1?'':'s')+' left, champion crowned Sunday.':'Champion crowned Sunday.')+'</p>'+
    '<div class="race">'+race+'</div>'+
    '<div class="cats">'+head.map(catBox).join('')+'</div>'+
    (rest.length?'<details class="all"><summary>All '+cats.length+' categories</summary><div class="cats">'+rest.map(catBox).join('')+'</div></details>':'')+
  '</section>';
}

function trend(n){
  if (!DAY || !H[n]) return '';
  const ks=[]; for (let i=13;i>=0;i--) ks.push(addDays(DAY,-i));
  const bars=ks.map(k=>{ const r=rec(n,k), v=r.rec;
    return '<i title="'+k+': recovery '+(v==null?'none':Math.round(v))+'" style="height:'+(v==null?4:Math.max(6,v))+'%;background:'+(v==null?'var(--raise)':band(v))+'"></i>'; }).join('');
  return '<section class="sec"><h2>'+esc(n)+'\u2019s last two weeks</h2><p class="note">Recovery each morning. Green 67 and up, yellow 34 to 66, red below.</p>'+
    '<div class="trend">'+bars+'</div><div class="tl"><span>2 weeks ago</span><span>Last night</span></div></section>';
}

function render(){
  const app=document.getElementById('app');
  let h='';
  if (!me && !view){ h+=picker(); }
  else {
    h+=whoStrip()+hero(view);
  }
  h+=matchups()+lastNight()+todaySoFar()+week()+(view?trend(view):'');
  h+='<footer>Updated '+esc(D.stamp||'')+' Eastern. Sleep counts under the night it began.'+(me?' <button class="nmb" data-forget="1">Not '+esc(me)+'?</button>':'')+'</footer>';
  app.innerHTML=h;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.querySelectorAll('.ring .arc').forEach(a=>a.setAttribute('stroke-dashoffset',a.getAttribute('data-off')));
    const sel=document.querySelector('.who button[aria-pressed="true"]'); if(sel) sel.scrollIntoView({block:'nearest',inline:'center'});
  }));
}

document.addEventListener('click', e=>{
  const t=e.target.closest('button'); if(!t) return;
  if (t.dataset.me){ me=t.dataset.me; view=me; try{localStorage.setItem(KEY,me);}catch(_){} render(); window.scrollTo({top:0}); }
  else if (t.dataset.view){ view=t.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'}); }
  else if (t.dataset.forget){ me=null; view=null; try{localStorage.removeItem(KEY);}catch(_){} render(); window.scrollTo({top:0}); }
});
render();
})();
</script>
</body></html>
